name = "cpagrip-postback"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The dashboard ships inside the Worker bundle, so there is nothing else to host.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Replace id with the value printed by:
#   npx wrangler kv namespace create CONVERSIONS
[[kv_namespaces]]
binding = "CONVERSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# POSTBACK_SECRET is a secret, not a var. Set it with:
#   npx wrangler secret put POSTBACK_SECRET
