<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo">🔍</span>
      <span class="name">SEO Inspector</span>
    </div>
    <button id="analyzeBtn" class="btn">Analyze page</button>
  </header>

  <div id="urlBar" class="url-bar" hidden></div>

  <div id="empty" class="empty">
    <p>Click <strong>Analyze page</strong> to inspect the current tab's SEO.</p>
  </div>

  <main id="results" hidden>
    <!-- Score -->
    <section class="score-card">
      <div class="score-ring" id="scoreRing">
        <span id="scoreNum">0</span><small>/100</small>
      </div>
      <div class="score-meta">
        <div class="score-label" id="scoreLabel">—</div>
        <div class="score-sub" id="scoreSub"></div>
      </div>
    </section>

    <!-- Checks summary -->
    <section class="summary" id="summary"></section>

    <!-- Detail groups injected here -->
    <div id="groups"></div>

    <!-- Paid features -->
    <section class="pro-block" id="proBlock">
      <div class="pro-head">
        <span class="pro-badge">PRO</span>
        <span>Unlock advanced tools</span>
      </div>
      <ul class="pro-list">
        <li>📊 SERP keyword rank tracking</li>
        <li>🆚 Competitor page comparison</li>
        <li>🔗 Backlink overview</li>
        <li>📦 Bulk audit multiple URLs</li>
        <li>📄 Export PDF / CSV reports</li>
        <li>💡 AI keyword & content suggestions</li>
      </ul>
      <button id="upgradeBtn" class="btn btn-pro">Upgrade to Pro — $9.99</button>

      <div class="license">
        <input id="licenseInput" type="text" placeholder="Have a key? Paste license key" />
        <button id="activateBtn" class="btn btn-activate">Activate</button>
      </div>
      <div id="licenseMsg" class="license-msg"></div>
    </section>
  </main>

  <script src="../lib/paywall.js"></script>
  <script src="panel.js"></script>
</body>
</html>
